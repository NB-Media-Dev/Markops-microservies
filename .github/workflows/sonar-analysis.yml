name: SonarCloud Scan Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Code Analysis Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Run the official SonarSource scanner step
      - name: Execute SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Step 3: Fetch Live Metrics and Detailed Errors List from API
      - name: Fetch Metrics and Generate Detailed Summary
        run: |
          echo "Waiting for SonarCloud server synchronization processing..."
          sleep 12
          
          PROJECT_KEY="NB-Media-Dev_Markops-microservies"
          
          # 1. Fetch Numerical Counts
          METRICS_JSON=$(curl -s "https://sonarcloud.io{PROJECT_KEY}&metricKeys=bugs,vulnerabilities,code_smells,duplicated_lines_density,security_hotspots")
          
          BUGS=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="bugs") | .value' || echo "0")
          VULNS=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="vulnerabilities") | .value' || echo "0")
          SMELLS=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="code_smells") | .value' || echo "0")
          HOTSPOTS=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="security_hotspots") | .value' || echo "0")
          DUP_PERCENT=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="duplicated_lines_density") | .value' || echo "0.0")

          # 2. Generate the Markdown Metric Count Grid Table Layout
          echo "### 📊 Live SonarCloud Quality Metrics Table" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Pillar | Target Category / Structural Module | Detected Value Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 **Reliability / Core Errors** | Functional Logic Bugs & Code Errors | **$BUGS** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **Vulnerabilities** | Known Security Holes & Flaws | **$VULNS** |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **Security Hotspots** | Unverified Risk Code Sections | **$HOTSPOTS** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 **Maintainability** | Structural Code Smells & Debt | **$SMELLS** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 **Duplication Density** | Repeated Code Fragments & Lines | **$DUP_PERCENT%** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 3. Fetch the Raw List of Individual Code Bugs & Structural Flaws
          echo "### 🔍 Itemized Code Defects & Errors List" >> $GITHUB_STEP_SUMMARY
          ISSUES_JSON=$(curl -s "https://sonarcloud.io{PROJECT_KEY}&resolved=false&ps=100")
          TOTAL_ISSUES_FOUND=$(echo "$ISSUES_JSON" | jq '.total')

          if [ "$TOTAL_ISSUES_FOUND" -eq "0" ]; then
            echo "✅ **Flawless Scan:** No unresolved bugs, vulnerabilities, or code smells found inside this project branch configuration!" >> $GITHUB_STEP_SUMMARY
          else
            echo "The scanner isolated the following unresolved code defects inside your source folders:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Type | Severity | Component File Path (Line Number) | Description Error Message |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            
            # Loop dynamically through each issue item array payload using jq formatting
            echo "$ISSUES_JSON" | jq -c '.issues[]' | while read -r issue; do
              TYPE=$(echo "$issue" | jq -r '.type')
              SEVERITY=$(echo "$issue" | jq -r '.severity')
              COMPONENT=$(echo "$issue" | jq -r '.component' | sed "s/^${PROJECT_KEY}://")
              LINE=$(echo "$issue" | jq -r '.line // "N/A"')
              MESSAGE=$(echo "$issue" | jq -r '.message')
              
              # Map Type to intuitive emojis for visual scannability
              if [ "$TYPE" = "BUG" ]; then TYPE_EMOJI="🔴 BUG";
              elif [ "$TYPE" = "VULNERABILITY" ]; then TYPE_EMOJI="🛡️ VULN";
              else TYPE_EMOJI="🟢 SMELL"; fi
              
              echo "| $TYPE_EMOJI | $SEVERITY | \`$COMPONENT\` (Line: $LINE) | $MESSAGE |" >> $GITHUB_STEP_SUMMARY
            done
          fi
