name: SonarCloud Scan Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Code Analysis Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository into the runner environment
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Run the official SonarSource scanner step
      - name: Execute SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Step 3: Fetch Live Metrics Data via API and Generate the Table 
      - name: Fetch Metrics and Generate Summary
        run: |
          echo "Pausing briefly for cloud data synchronization..."
          sleep 10
          
          # Fetch structural metric counts directly from SonarCloud component APIs
          METRICS_JSON=$(curl -s "https://sonarcloud.io")
          
          # Extract specific numerical values using jq processing
          BUGS=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="bugs") | .value' || echo "0")
          VULNS=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="vulnerabilities") | .value' || echo "0")
          SMELLS=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="code_smells") | .value' || echo "0")
          HOTSPOTS=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="security_hotspots") | .value' || echo "0")
          DUP_PERCENT=$(echo "$METRICS_JSON" | jq -r '.component.measures[] | select(.metric=="duplicated_lines_density") | .value' || echo "0.0")

          # Safeguard missing metric arrays
          if [ -z "$BUGS" ]; then BUGS="0"; fi
          if [ -z "$VULNS" ]; then VULNS="0"; fi
          if [ -z "$SMELLS" ]; then SMELLS="0"; fi
          if [ -z "$HOTSPOTS" ]; then HOTSPOTS="0"; fi
          if [ -z "$DUP_PERCENT" ]; then DUP_PERCENT="0.0"; fi

          # Generate the Markdown table layout inside GitHub Actions Output Summary
          echo "### 📊 Live SonarCloud Quality Metrics Table" >> $GITHUB_STEP_SUMMARY
          echo "The following values represent live data extracted directly from your current microservices analysis profile run:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate Category | Tracked Structural Errors & Defect Types | Detected Value Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 **Reliability / Core Errors** | Functional Logic Bugs & Code Errors | **$BUGS** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **Vulnerabilities** | Known Security Holes & Code Flaws | **$VULNS** |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **Security Hotspots** | Unverified Risk Code Sections | **$HOTSPOTS** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 **Maintainability** | Structural Code Smells & Technical Debt | **$SMELLS** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 **Duplication Density** | Repeated Code Fragments & Copied Lines | **$DUP_PERCENT%** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Print status notification based on issues count
          TOTAL_ISSUES=$((BUGS + VULNS))
          if [ "$TOTAL_ISSUES" -gt 0 ]; then
            echo "⚠️ **Action Recommended:** Critical bugs or vulnerabilities were processed in this branch. Please inspect the code components." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Quality Standards Passed:** No blocking bugs or critical security vulnerabilities detected." >> $GITHUB_STEP_SUMMARY
          fi
