name: SonarCloud Scan Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Code Analysis Scan
    runs-on: ubuntu-latest
    
    # Required permissions to post status messages
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # === NEW STEP: GENERATE METRIC TABLE SUMMARY ===
      - name: Generate SonarCloud Metric Table Summary
        uses: thecanadianroot/sonarcloud-summary-action@v1
        with:
          github-repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
