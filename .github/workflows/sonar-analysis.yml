name: Localhost SonarQube Scan Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube_local_scan:
    name: Code Analysis Scan
    # Tells GitHub to execute this job strictly on your machine's local runner
    runs-on: [self-hosted, Windows]

    steps:
      # Step 1: Sync the code branches locally
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Execute your local SonarScanner CLI tool natively
      - name: Execute Native SonarScanner CLI
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: cmd
        run: |
          "D:\New folder\sonar-scanner-8.1.0.6389-windows-x64\bin\sonar-scanner.bat" ^
            -Dsonar.token=%SONAR_TOKEN%

      # Step 3: Fetch Live Metrics from your Local Engine to GitHub Summary
      - name: Fetch Metrics and Generate Detailed Summary
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Microservice
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const token = process.env.SONAR_TOKEN || "";
          const project = process.env.SONAR_PROJECT_KEY;
          const summary = process.env.GITHUB_STEP_SUMMARY;
          
          function md(value) {
            return String(value ?? "-").replace(/\r?\n/g, " ").replace(/\|/g, "\\|").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          }
          function append(text) {
            fs.appendFileSync(summary, text);
          }
          async function sonarFetch(path, params = {}) {
            if (!token) throw new Error("SonarQube token is missing.");
            const url = new URL("http://localhost:9000" + path);
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, String(value));
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${token}` },
              signal: AbortSignal.timeout(60000)
            });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            return response.json();
          }
          async function main() {
            append("### 📊 Live Local SonarQube Quality Metrics Table\n\n");
            try {
              const metricsResult = await sonarFetch("/api/measures/component", {
                component: project,
                metricKeys: "bugs,vulnerabilities,code_smells,duplicated_lines_density,security_hotspots"
              });
              const measures = metricsResult.component?.measures || [];
              const getMetric = (key) => measures.find(m => m.metric === key)?.value || "0";
              append("| Quality Pillar | Target Category | Value |\n| :--- | :--- | :--- |\n");
              append(`| 🔴 **Bugs** | Core Errors | **${getMetric("bugs")}** |\n`);
              append(`| 🛡️ **Vulnerabilities** | Security Flaws | **${getMetric("vulnerabilities")}** |\n`);
              append(`| ⚡ **Hotspots** | Unverified Sections | **${getMetric("security_hotspots")}** |\n`);
              append(`| 🟢 **Code Smells** | Debt | **${getMetric("code_smells")}** |\n`);
            } catch (err) {
              append(`**Failed to load summary metric counts table:** ${md(err.message)}\n\n`);
            }
          }
          main().catch(console.error);
          NODE
