name: SonarQube Local Report Viewer

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  render-report:
    name: Parse Uploaded Local Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository (the report file will be inside it)
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step 2: Read the JSON file and print the table into GitHub summary
      - name: Generate Metric Summary Table
        run: |
          # If the file doesn't exist yet in the repo, print a friendly message instead of failing
          if [ ! -f "sonar-report.json" ]; then
            echo "### ⚠️ Awaiting Local Scan Run Data" >> $GITHUB_STEP_SUMMARY
            echo "Please execute your local terminal command string on your PC to push the first report to this dashboard." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          # Parse the local file values using jq natively
          BUGS=$(jq -r '.issues[] | select(.type=="BUG") | .key' sonar-report.json 2>/dev/null | wc -l || echo "0")
          VULNS=$(jq -r '.issues[] | select(.type=="VULNERABILITY") | .key' sonar-report.json 2>/dev/null | wc -l || echo "0")
          SMELLS=$(jq -r '.issues[] | select(.type=="CODE_SMELL") | .key' sonar-report.json 2>/dev/null | wc -l || echo "0")

          echo "### 📊 Live Local Server Quality Metrics Table" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Pillar | Target Category / Structural Module | Detected Value Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 **Reliability / Core Errors** | Functional Logic Bugs & Code Errors | **$BUGS** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **Security Vulnerabilities** | Known Security Holes & Flaws | **$VULNS** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 **Maintainability** | Structural Code Smells & Debt | **$SMELLS** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔍 Itemized Local Server Defects & Errors List" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Severity | File Path | Message Error Description |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          jq -c '.issues[]' sonar-report.json 2>/dev/null | while read -r issue; do
            TYPE=$(echo "$issue" | jq -r '.type')
            SEV=$(echo "$issue" | jq -r '.severity')
            FILE=$(echo "$issue" | jq -r '.component')
            MSG=$(echo "$issue" | jq -r '.message')
            echo "| $TYPE | $SEV | \`$FILE\` | $MSG |" >> $GITHUB_STEP_SUMMARY
          done
