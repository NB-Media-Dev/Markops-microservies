name: SonarCloud Scan Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Code Analysis Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository into the virtual runner environment
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Run the official SonarSource scanner step
      - name: Execute SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Step 3: Inject the formatted Metric Summary Table into the GitHub interface
      - name: Generate Metric Summary Table
        run: |
          echo "### 📊 SonarCloud Analysis Metrics" >> $GITHUB_STEP_SUMMARY
          echo "Your code scan completed successfully. Below are the tracked metric modules:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Pillar | Target Security & Code Quality Standards |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 **Security** | Vulnerabilities & Insecure Hotspots |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 **Reliability** | Production Logic Bugs & Code Errors |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 **Maintainability** | Architectural Code Smells & Technical Debt |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 **Duplication** | Repeated Code Fragments & Copied Layout Text |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Full Dashboard Access" >> $GITHUB_STEP_SUMMARY
          echo "[👉 Click here to view live detailed graphs and coverage trends](https://sonarcloud.io)" >> $GITHUB_STEP_SUMMARY
