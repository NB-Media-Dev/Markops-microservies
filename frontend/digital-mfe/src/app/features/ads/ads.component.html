<div class="ads-page" [class.embedded-view]="embedded">

  @if (!embedded) {
    <header class="page-clean-branding-header">
      <div class="header-titles-block">
        <h1 class="page-main-orange-title">Digital Marketing</h1>
        <div class="page-breadcrumb-subrow">
          <a
            (click)="onBreadcrumbNavigate('dashboard', $event)"
            class="bc-link"
            href="javascript:void(0)"
          >{{ activeProductName() }}</a>
          <span class="bc-sep">&gt;</span>
          <a
            (click)="onBreadcrumbNavigate('packages', $event)"
            class="bc-link"
            href="javascript:void(0)"
          >Available Package</a>
          <span class="bc-sep">&gt;</span>
          <a
            (click)="onBreadcrumbNavigate('operations', $event)"
            class="bc-link"
            href="javascript:void(0)"
          >Department Operations</a>
          <span class="bc-sep">&gt;</span>
          <a routerLink="/campaigns" class="bc-link">Digital Marketing</a>
          <span class="bc-sep">&gt;</span>
          <span class="bc-current">Ads Metrics</span>
        </div>
      </div>
      @if (canManageAds()) {
        <div class="header-actions">
          <button class="btn-action-secondary" [disabled]="syncing()" (click)="syncAdAccounts()">
            <span class="material-symbols-outlined fs-18" [class.spinning]="syncing()">sync</span>
            <span>{{ syncing() ? 'Syncing...' : 'Sync Ad Accounts' }}</span>
          </button>
          <button class="btn-action-primary" (click)="openCreateModal()">
            <span class="material-symbols-outlined icon-glow">add_chart</span>
            <span>Add Ad Metric</span>
          </button>
        </div>
      }
    </header>
  }

  @if (successMessage()) {
    <div class="alert-banner alert-success">
      <div class="alert-icon-wrap">
        <span class="material-symbols-outlined">check_circle</span>
      </div>
      <span class="alert-text">{{ successMessage() }}</span>
    </div>
  }

  @if (errorMessage()) {
    <div class="alert-banner alert-danger">
      <div class="alert-icon-wrap">
        <span class="material-symbols-outlined">error</span>
      </div>
      <span class="alert-text">{{ errorMessage() }}</span>
    </div>
  }

  <app-ad-kpis
    [totalSpend]="totalSpend()"
    [filteredAdsCount]="filteredAds.length"
    [totalLeads]="totalLeads()"
    [averageCpl]="averageCpl()"
    [averageCtr]="averageCtr()"
  ></app-ad-kpis>

  <app-ads-toolbar
    [searchQuery]="searchQuery()"
    [filterPlatform]="filterPlatform()"
    (searchChange)="searchQuery.set($event)"
    (filterChange)="filterPlatform.set($event)"
  ></app-ads-toolbar>

  <app-ads-table
    [ads]="filteredAds"
    [canManageAds]="canManageAds()"
    [currentUserId]="authService.currentUser()?.id ?? null"
    (create)="openCreateModal()"
    (edit)="openEditModal($event)"
    (delete)="confirmDelete($event)"
  ></app-ads-table>

  <app-ad-form-modal
    [isOpen]="showModal()"
    [isEditing]="isEditing()"
    [formModel]="formModel"
    [campaigns]="filteredCampaigns()"
    [tasks]="taskService.tasks()"
    [packageFilter]="packageFilterSignal()"
    [computedModalCpl]="computedModalCpl"
    [computedModalCtr]="computedModalCtr"
    (campaignSelected)="onCampaignSelected($event)"
    (closeModal)="closeModal()"
    (save)="saveAd()"
  ></app-ad-form-modal>

  <app-ad-delete-modal
    [target]="deleteConfirmTarget()"
    (cancelDelete)="cancelDelete()"
    (confirm)="executeDelete()"
  ></app-ad-delete-modal>
</div>
